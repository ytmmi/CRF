[package]
name = "crf-viewer"
# 三位 semver 对应正式版本 0.3.7.0(a.b.c 与文档一致,d=bug修复不进 Cargo)。
# 版本号命名规则见 docs/project-standards.md §13;每次 git push 前必须递增。
version = "0.3.7"
edition = "2021"
description = "CRF (Compressing Residual Frames) - Differential Image Compression Codec"

[workspace]
members = [".", "cuda-runtime"]
# default-members 同时包含 sidecar DLL：`cargo build --release`（不带 --workspace）
# 也会重建 crf_cuda.dll，避免 EXE 与 DLL 版本不同步（GPU kernel 探针曾因旧 DLL
# 缺 rct_forward 导出而报「export is missing」）。
default-members = [".", "cuda-runtime"]
resolver = "2"

[features]
default = ["nvidia-cuda"]
# 通过旁路 crf_cuda.dll 动态加载 NVIDIA Driver API；不要求安装 CUDA SDK。
nvidia-cuda = []

[dependencies]
image = { version = "0.25", features = ["png", "bmp", "tiff", "jpeg", "webp"] }
rayon = "1"
crc32fast = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
# v1.11 实验记录：曾试验 fat LTO + codegen-units=1，实测未获得稳定收益
# （编码耗时受机器负载波动影响大于配置差异）且编译时间约翻倍，保守还原。
# target-cpu=native 明确拒绝：分发产物须保持基线指令集兼容，
# SIMD 已由 format/simd.rs 运行时分派按需启用。
