# CRF 发布工作流（GitHub Release）
#
# 触发：推送 v* 标签（如 v0.3.3.21，四段式版本规则见 docs/project-standards.md §13）。
# 三平台矩阵构建 release，并显式开启 nvidia-cuda feature（与 README 发布命令一致）。
# 工具链锁定 1.96.1（见仓库根 rust-toolchain.toml），保证发布产物可复现。
# 打包规则（docs/project-standards.md §11.1：主程序必须与 CUDA sidecar 一起分发）：
#   - Windows：.zip 含 crf-viewer.exe + crf_cuda.dll
#   - Linux：.tar.gz 含 crf-viewer + libcrf_cuda.so
#   - macOS：.tar.gz 含 crf-viewer + libcrf_cuda.dylib
# 各平台腿将归档上传到同一 GitHub Release（softprops/action-gh-release，自动生成发布说明）。

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: 构建与发布（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链（1.96.1）
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.1

      - name: 缓存 Cargo 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Release 构建（--features nvidia-cuda）
        run: cargo build --manifest-path src-tauri/Cargo.toml --workspace --release --features nvidia-cuda

      - name: 按平台打包
        id: package
        shell: bash
        run: |
          case "${{ matrix.os }}" in
            windows-latest)
              mkdir -p staging
              cp src-tauri/target/release/crf-viewer.exe staging/
              cp src-tauri/target/release/crf_cuda.dll staging/
              ARCHIVE="crf-viewer-windows.zip"
              (cd staging && zip -r "../${ARCHIVE}" .)
              ;;
            ubuntu-latest)
              mkdir -p staging
              cp src-tauri/target/release/crf-viewer staging/
              cp src-tauri/target/release/libcrf_cuda.so staging/
              ARCHIVE="crf-viewer-linux.tar.gz"
              tar -czf "${ARCHIVE}" -C staging .
              ;;
            macos-latest)
              mkdir -p staging
              cp src-tauri/target/release/crf-viewer staging/
              cp src-tauri/target/release/libcrf_cuda.dylib staging/
              ARCHIVE="crf-viewer-macos.tar.gz"
              tar -czf "${ARCHIVE}" -C staging .
              ;;
          esac
          echo "archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"

      - name: 上传归档到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.archive }}
